name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias materialyouplayer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass player123 \
            -keypass player123 \
            -dname "CN=MaterialYouPlayer, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      - name: Build Release APK
        run: ./gradlew --console=plain assembleRelease --warning-mode summary
        env:
          APPLICATION_ID: com.example.materialyouplayer
          APP_NAME: MaterialYouPlayer
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign APK
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name "*unsigned*.apk" | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -r | head -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -1)
          $ZIPALIGN -v -f 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-pass pass:player123 \
            --ks-key-alias materialyouplayer \
            --key-pass pass:player123 \
            --out app/build/outputs/apk/release/MaterialYouPlayer.apk \
            app/build/outputs/apk/release/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialYouPlayer
          path: app/build/outputs/apk/release/MaterialYouPlayer.apk
